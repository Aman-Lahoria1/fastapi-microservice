version: "3.9"

services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    expose:
      - "8000"
    volumes:
      - ./auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/authdb
      ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/authdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    restart: unless-stopped

  user-service:
    build: ./user-service
    expose:
      - "8001"
    volumes:
      - ./user-service:/app
    depends_on:
      - auth-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
    restart: unless-stopped

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data: